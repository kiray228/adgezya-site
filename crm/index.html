<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2548">
<title>Адгезия CRM</title>
<style>
  :root { --navy: #0B2548; --blue: #2169B0; --amber: #F2A900; --ink: #1D2733; --grey: #5E6B7A; --line: #DCE4EE;
    --light: #EEF3F9; --bg: #F3F5F8; --ok: #1F9D55; --bad: #C0392B; --out: #DCF5E3; --bot: #E3EEFB; --head: 52px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header { height: var(--head); background: var(--navy); color: #fff; display: flex; align-items: center; gap: 4px; padding: 0 10px; position: sticky; top: 0; z-index: 20; }
  header .logo { font-weight: 800; letter-spacing: .05em; margin-right: 8px; white-space: nowrap; }
  header .logo small { font-weight: 400; opacity: .6; letter-spacing: 0; }
  nav { display: flex; gap: 2px; overflow-x: auto; }
  nav button { background: none; border: 0; color: #fff; opacity: .7; padding: 8px 10px; border-radius: 8px; white-space: nowrap; }
  nav button.on { opacity: 1; background: rgba(255,255,255,.14); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--amber); color: var(--navy); font-size: 12px; font-weight: 800; text-align: center; margin-left: 4px; }
  #out { margin-left: auto; background: none; border: 0; color: #fff; opacity: .6; }
  .btn { border: 0; border-radius: 8px; padding: 8px 14px; background: var(--blue); color: #fff; font-weight: 600; }
  .btn.sec { background: var(--light); color: var(--navy); }
  .btn.ok { background: var(--ok); }
  .btn:disabled { opacity: .5; cursor: default; }
  .login { max-width: 360px; margin: 12vh auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 6px 24px rgba(11,37,72,.1); display: grid; gap: 12px; }
  input[type=text], input[type=password], input:not([type]), textarea, select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; }
  .muted { color: var(--grey); font-size: 13px; }

  /* чаты */
  .chats { display: grid; grid-template-columns: 340px 1fr; height: calc(100dvh - var(--head)); }
  .list { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .list .search { padding: 10px; border-bottom: 1px solid var(--line); }
  .list ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .list li { padding: 10px 12px; border-bottom: 1px solid var(--light); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .list li:hover { background: var(--light); }
  .list li.on { background: #E6EEF8; }
  .list li.need { box-shadow: inset 3px 0 0 var(--bad); }
  .list .nm { font-weight: 700; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .tm { font-size: 12px; color: var(--grey); text-align: right; }
  .list .pv { font-size: 13px; color: var(--grey); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .un { justify-self: end; }
  .tags { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--light); color: var(--navy); }
  .tag.src { background: #FFF3CD; color: #7A5A00; }
  .tag.need { background: #FDE3E0; color: var(--bad); }
  .tag.bot { background: var(--bot); color: var(--blue); }
  .conv { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .conv .empty { margin: auto; color: var(--grey); text-align: center; padding: 20px; }
  .chead { background: #fff; border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .chead .who { flex: 1; min-width: 140px; }
  .chead .who b { color: var(--navy); display: block; }
  .chead .who a { color: var(--grey); font-size: 13px; text-decoration: none; }
  .chead select { width: auto; padding: 5px 8px; }
  .back { display: none; background: none; border: 0; font-size: 22px; color: var(--navy); padding: 0 6px; }
  .lead { background: #fff; border-bottom: 1px solid var(--line); padding: 0 12px; font-size: 14px; }
  .lead summary { padding: 8px 0; color: var(--blue); cursor: pointer; font-weight: 600; }
  .lead .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 3px 16px; padding-bottom: 8px; }
  .lead .grid span { color: var(--grey); }
  .lead textarea { margin-bottom: 10px; min-height: 38px; }
  .handoff { background: #FDE3E0; color: var(--bad); padding: 6px 12px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: #EAE6DF; }
  .day { align-self: center; font-size: 12px; color: var(--grey); background: rgba(255,255,255,.8); padding: 2px 10px; border-radius: 8px; margin: 6px 0; }
  .b { max-width: min(78%, 560px); padding: 6px 10px 4px; border-radius: 10px; background: #fff; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,.08); white-space: pre-wrap; word-wrap: break-word; }
  .b.out { align-self: flex-end; background: var(--out); }
  .b.out.bot { background: var(--bot); }
  .b .meta { font-size: 11px; color: var(--grey); text-align: right; margin-top: 2px; white-space: nowrap; }
  .b .who { font-size: 11px; font-weight: 700; color: var(--blue); }
  .b .st.read { color: #34B7F1; }
  .b .st.failed { color: var(--bad); }
  .b .fail { font-size: 12px; color: var(--bad); }
  .b img { max-width: 100%; max-height: 320px; border-radius: 6px; display: block; }
  .b audio { max-width: 240px; }
  .b .mbtn { background: var(--light); border: 0; border-radius: 6px; padding: 4px 10px; color: var(--navy); font-size: 13px; }
  .b a { color: var(--blue); }
  .comp { background: #fff; border-top: 1px solid var(--line); padding: 8px; }
  .comp .row { display: flex; gap: 6px; align-items: flex-end; }
  .comp textarea { min-height: 40px; max-height: 160px; resize: none; }
  .comp .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .comp .tools button { background: var(--light); border: 0; border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--navy); }
  .note { padding: 10px 12px; font-size: 14px; color: #7A5A00; background: #FFF3CD; }
  .menu { position: absolute; bottom: 100%; left: 8px; right: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 50vh; overflow-y: auto; z-index: 5; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--light); padding: 8px 12px; font-size: 14px; }
  .menu button:hover { background: var(--light); }
  @media (max-width: 520px) {
    header .logo small { display: none; }
    header .logo { margin-right: 0; font-size: 14px; }
    nav button { padding: 8px 7px; font-size: 14px; }
    #out { font-size: 13px; padding: 4px; }
  }
  @media (max-width: 899px) {
    .chats { grid-template-columns: 1fr; }
    .chats.open .list { display: none; }
    .chats:not(.open) .conv { display: none; }
    .back { display: block; }
  }

  /* заявки и настройки */
  .page { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .bar input { flex: 1; min-width: 180px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--navy); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip b { opacity: .7; margin-left: 4px; }
  .card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(11,37,72,.08); border-left: 4px solid var(--line); display: grid; gap: 8px; }
  .card.new { border-left-color: var(--amber); }
  .card.won { border-left-color: var(--ok); }
  .card.lost, .card.spam { opacity: .7; }
  .card .top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
  .code { font-weight: 800; color: var(--navy); font-family: Consolas, monospace; font-size: 16px; }
  .card .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 2px 16px; font-size: 14px; }
  .card .grid span { color: var(--grey); }
  .card .act { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .card .act select { width: auto; }
  .card .act textarea { flex: 1; min-width: 200px; min-height: 36px; }
  details pre { white-space: pre-wrap; margin: 6px 0 0; font: inherit; background: var(--light); padding: 8px; border-radius: 8px; }
  .set { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(11,37,72,.08); display: grid; gap: 10px; }
  .set h3 { margin: 0; color: var(--navy); font-size: 17px; }
  .set label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; color: var(--navy); }
  .set label small { font-weight: 400; color: var(--grey); }
  .copy { display: flex; gap: 6px; } .copy input { font-family: Consolas, monospace; font-size: 13px; }
  .set ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .saved { font-size: 13px; color: var(--ok); }
</style>
</head>
<body>
<header>
  <span class="logo">АДГЕЗИЯ <small>CRM</small></span>
  <nav id="nav" hidden>
    <button data-v="chats">Чаты<span class="badge" id="unread" hidden></span></button>
    <button data-v="leads">Заявки</button>
    <button data-v="settings">Настройки</button>
  </nav>
  <button id="out" hidden>Выйти</button>
</header>
<main id="app">
  <form class="login" id="login">
    <b>Вход для менеджера</b>
    <input type="password" id="key" placeholder="Ключ доступа" autocomplete="current-password" required>
    <button class="btn">Войти</button>
    <div class="err" id="err"></div>
  </form>
</main>
<script>window.ADG_API = "https://br-damp-wave-b1sg1i7t-leads.compute.c-5.eu-central-1.aws.neon.tech";</script>
<script>
(() => {
  const SITE = "https://kiray228.github.io/adgezya-site/";
  // адрес функции CRM: подставляет site/build.py (страница лежит на сайте /crm/); пусто — тот же адрес
  const API = (window.ADG_API || "").replace(/\/+$/, "");
  const ST = { new: "Новая", in_work: "В работе", measure: "Замер", quote: "КП отправлено", won: "Договор", lost: "Отказ", spam: "Спам" };
  const KIND = { form: "Форма с сайта", wa: "Кнопка WhatsApp на сайте", chat: "Написал в WhatsApp" };
  const QUICK = [
    "Здравствуйте! Это «Адгезия», Шымкент. Подскажите, что нужно: забор, ворота, перила или благоустройство? И примерные размеры — длина и высота.",
    "Пришлите, пожалуйста, фото участка и примерные размеры — посчитаем стоимость.",
    "Можем приехать на замер. Подскажите адрес объекта и когда вам удобно?",
    "Наш офис: г. Шымкент, район Туран, ул. Зердели, 4.",
    "Спасибо! Подготовим расчёт и пришлём сюда.",
  ];
  const app = document.getElementById("app");
  const $ = (s, el = document) => el.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch (_) { return null; } },
                  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} } };
  let key = store.get("adg_key") || "";
  let view = store.get("adg_view") || "chats";
  const st = { chats: [], connected: false, cur: null, chat: null, lastId: 0, unread: 0, leadFilter: { status: "", q: "" }, chatQ: "" };
  let tChats, tChat;

  const api = async (path, opts = {}) => {
    const r = await fetch(API + path, { ...opts, headers: { authorization: "Bearer " + key, ...(opts.headers || {}) } });
    if (r.status === 401) { throw Object.assign(new Error("Неверный ключ"), { auth: true }); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.message || d.error || ("Ошибка " + r.status)), { data: d, status: r.status });
    return d;
  };
  const tz = { timeZone: "Asia/Almaty" };
  const hm = (t) => new Date(t).toLocaleTimeString("ru-RU", { ...tz, hour: "2-digit", minute: "2-digit" });
  const dayOf = (t) => new Date(t).toLocaleDateString("ru-RU", { ...tz, day: "numeric", month: "long" });
  const short = (t) => { const d = new Date(t); return dayOf(t) === dayOf(Date.now()) ? hm(t) : d.toLocaleDateString("ru-RU", { ...tz, day: "2-digit", month: "2-digit" }); };
  const phone = (w) => "+" + String(w).replace(/^(\d)(\d{3})(\d{3})(\d{2})(\d{2})$/, "$1 $2 $3 $4 $5");

  // текст с кликабельными ссылками (без innerHTML)
  function linkify(text) {
    const f = document.createDocumentFragment();
    String(text).split(/(https?:\/\/[^\s]+)/g).forEach((part, i) => {
      if (i % 2) { const a = el("a", null, part); a.href = part; a.target = "_blank"; a.rel = "noopener"; f.append(a); }
      else if (part) f.append(part);
    });
    return f;
  }

  function beep() {
    try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .15); } catch (_) {}
  }

  // ---------- вход и навигация
  $("#login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    key = $("#key").value.trim();
    try { await api("/api/chats"); store.set("adg_key", key); start(); }
    catch (e) { $("#err").textContent = e.auth ? "Неверный ключ" : "Сервер недоступен"; }
  });
  $("#out").addEventListener("click", () => { try { sessionStorage.clear(); } catch (_) {} location.reload(); });
  $("#nav").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-v]"); if (b) go(b.dataset.v); });

  function start() {
    $("#nav").hidden = false; $("#out").hidden = false;
    go(view);
    pollChats();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pollChats(); });
  }
  function go(v) {
    view = v; store.set("adg_view", v);
    document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
    clearTimeout(tChat);
    if (v === "chats") renderChats(); else if (v === "leads") loadLeads(); else loadSettings();
  }

  // ---------- чаты
  async function pollChats() {
    clearTimeout(tChats);
    try {
      const d = await api("/api/chats" + (st.chatQ ? "?q=" + encodeURIComponent(st.chatQ) : ""));
      st.chats = d.chats; st.connected = d.connected;
      const total = d.chats.reduce((s, c) => s + c.unread, 0);
      if (total > st.unread) beep();
      st.unread = total;
      $("#unread").hidden = !total; $("#unread").textContent = total;
      document.title = (total ? `(${total}) ` : "") + "Адгезия CRM";
      if (view === "chats") renderList();
    } catch (e) { if (e.auth) location.reload(); }
    tChats = setTimeout(pollChats, document.hidden ? 30000 : 6000);
  }

  function renderChats() {
    app.textContent = "";
    const wrap = el("div", "chats" + (st.cur ? " open" : ""));
    const list = el("aside", "list");
    const s = el("div", "search"); const q = el("input"); q.placeholder = "Поиск: имя, номер, код заявки"; q.value = st.chatQ;
    let t; q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { st.chatQ = q.value.trim(); pollChats(); }, 300); });
    s.append(q); list.append(s, el("ul"));
    const conv = el("section", "conv");
    wrap.append(list, conv); app.append(wrap);
    renderList();
    if (st.cur) openChat(st.cur, true); else conv.append(emptyConv());
  }
  function emptyConv() {
    const d = el("div", "empty");
    d.append(el("div", null, st.connected ? "Выберите диалог" : "WhatsApp ещё не подключён."));
    if (!st.connected) { const b = el("button", "btn", "Открыть настройки"); b.style.marginTop = "10px"; b.onclick = () => go("settings"); d.append(b); }
    return d;
  }
  function renderList() {
    const ul = $(".list ul"); if (!ul) return;
    ul.textContent = "";
    if (!st.chats.length) { ul.append(el("li", "muted", st.connected ? "Сообщений пока нет" : "Сообщения появятся после подключения WhatsApp")); return; }
    for (const c of st.chats) {
      const li = el("li", (c.id === st.cur ? "on" : "") + (c.needs_manager ? " need" : ""));
      li.append(el("span", "nm", c.name || phone(c.wa_id)), el("span", "tm", short(c.last_at)));
      const l = c.last || {};
      const pv = (l.direction === "out" ? (l.sender === "bot" ? "🤖 " : "Вы: ") : "") + (l.body || (l.type ? `[${l.type}]` : ""));
      li.append(el("span", "pv", pv));
      const un = el("span", "un"); if (c.unread) un.append(el("span", "badge", String(c.unread))); li.append(un);
      const tags = el("div", "tags");
      if (c.needs_manager) tags.append(el("span", "tag need", "нужен менеджер"));
      if (c.status) tags.append(el("span", "tag", ST[c.status]));
      if (c.source) tags.append(el("span", "tag src", c.source));
      if (c.code) tags.append(el("span", "tag", "№" + c.code));
      li.append(tags);
      li.addEventListener("click", () => openChat(c.id));
      ul.append(li);
    }
  }

  async function openChat(id, keep) {
    if (st.cur !== id || !keep) { st.lastId = 0; st.chat = null; }
    st.cur = id;
    $(".chats")?.classList.add("open");
    document.querySelectorAll(".list li").forEach((li, i) => li.classList.toggle("on", st.chats[i]?.id === id));
    clearTimeout(tChat);
    let d;
    try { d = await api(`/api/chat/${id}`); } catch (e) { return; }
    st.chat = d; st.lastId = d.messages.length ? d.messages[d.messages.length - 1].id : 0;
    renderConv();
    if (d.contact.unread) { api(`/api/chat/${id}/read`, { method: "POST" }).then(pollChats).catch(() => {}); }
    tChat = setTimeout(pollChat, 3000);
  }

  async function pollChat() {
    clearTimeout(tChat);
    if (view !== "chats" || !st.cur) return;
    try {
      const d = await api(`/api/chat/${st.cur}?after=${st.lastId}`);
      st.chat.contact = d.contact; st.chat.lead = d.lead;
      const box = $(".msgs");
      if (d.messages.length && box) {
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        d.messages.forEach((m) => { st.chat.messages.push(m); box.append(bubble(m)); });
        st.lastId = d.messages[d.messages.length - 1].id;
        if (atBottom) box.scrollTop = box.scrollHeight;
        if (d.messages.some((m) => m.direction === "in")) api(`/api/chat/${st.cur}/read`, { method: "POST" }).catch(() => {});
      }
      for (const s of d.statuses) {
        const b = document.querySelector(`.b[data-id="${s.id}"] .st`);
        if (b) { b.className = "st " + s.status; b.textContent = ticks(s.status); }
      }
      renderHeadState();
    } catch (_) {}
    tChat = setTimeout(pollChat, document.hidden ? 15000 : 3000);
  }

  const ticks = (s) => ({ sent: "✓", delivered: "✓✓", read: "✓✓", failed: "⚠", pending: "🕓" }[s] || "");

  function bubble(m) {
    const b = el("div", "b " + m.direction + (m.sender === "bot" ? " bot" : ""));
    b.dataset.id = m.id;
    if (m.sender === "bot") b.append(el("div", "who", "🤖 бот"));
    if (m.media_id) b.append(mediaBlock(m));
    else if (m.type === "document" && m.filename) b.append(el("div", null, "📄 " + m.filename));
    if (m.body) b.append(linkify(m.body));
    else if (!m.media_id && m.type !== "text") b.append(el("span", "muted", `[${m.type}]`));
    const meta = el("div", "meta", hm(m.at) + " ");
    if (m.direction === "out") { const s = el("span", "st " + (m.status || ""), ticks(m.status)); meta.append(s); }
    b.append(meta);
    if (m.status === "failed" && m.error) b.append(el("div", "fail", "Не доставлено: " + m.error));
    return b;
  }
  function mediaBlock(m) {
    const box = el("div");
    const label = { image: "📷 Показать фото", audio: "🎤 Голосовое", video: "🎬 Видео", document: "📄 " + (m.filename || "Документ"), sticker: "Стикер" }[m.type] || "Файл";
    const btn = el("button", "mbtn", label);
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "Загрузка…";
      try {
        const r = await fetch(`${API}/api/media/${m.media_id}`, { headers: { authorization: "Bearer " + key } });
        if (!r.ok) throw new Error();
        const url = URL.createObjectURL(await r.blob());
        let node;
        if (m.type === "image" || m.type === "sticker") { node = el("img"); node.src = url; }
        else if (m.type === "audio") { node = el("audio"); node.controls = true; node.src = url; }
        else if (m.type === "video") { node = el("video"); node.controls = true; node.src = url; node.style.maxWidth = "100%"; }
        else { node = el("a", null, "Скачать " + (m.filename || "файл")); node.href = url; node.download = m.filename || "file"; }
        box.replaceChildren(node);
      } catch (_) { btn.disabled = false; btn.textContent = "Не удалось загрузить — ещё раз"; }
    });
    box.append(btn);
    if (m.type === "image") btn.click();
    return box;
  }

  function renderConv() {
    const conv = $(".conv"); if (!conv) return;
    conv.textContent = "";
    const { contact: c, lead: l, messages } = st.chat;
    // шапка
    const head = el("div", "chead");
    const back = el("button", "back", "‹"); back.title = "К списку";
    back.addEventListener("click", () => { st.cur = null; clearTimeout(tChat); $(".chats").classList.remove("open"); renderList(); });
    const who = el("div", "who"); who.append(el("b", null, c.name || phone(c.wa_id)));
    const tel = el("a", null, phone(c.wa_id)); tel.href = "tel:+" + c.wa_id; who.append(tel);
    head.append(back, who);
    if (l) {
      const sel = el("select");
      Object.entries(ST).forEach(([k, v]) => { const o = el("option", null, v); o.value = k; o.selected = k === l.status; sel.append(o); });
      sel.addEventListener("change", () => api(`/api/lead/${l.id}`, { method: "POST", body: JSON.stringify({ status: sel.value }) }).then(pollChats));
      head.append(sel);
    }
    const botBtn = el("button", "btn sec"); botBtn.id = "botbtn";
    botBtn.addEventListener("click", async () => {
      const d = await api(`/api/chat/${c.id}/bot`, { method: "POST", body: JSON.stringify({ off: !st.chat.contact.bot_off }) });
      st.chat.contact = { ...st.chat.contact, ...d }; renderHeadState(); pollChats();
    });
    head.append(botBtn);
    conv.append(head);
    const ho = el("div", "handoff"); ho.id = "handoff"; conv.append(ho);
    // заявка
    if (l) {
      const det = el("details", "lead");
      det.append(el("summary", null, `Заявка №${l.code} · ${KIND[l.kind] || l.kind}${l.source ? " · " + l.source : ""}`));
      const g = el("div", "grid");
      const row = (k, v) => { if (v == null || v === "" || v === false) return; const x = el("div"); x.append(el("span", null, k + ": "), String(v === true ? "да" : v)); g.append(x); };
      row("Модель", l.model); row("Раздел", l.category); row("Объект", l.object_type); row("Изделие", l.product);
      row("Длина, м", l.length_m); row("Высота, м", l.height_m); row("Ворота", l.gates || (l.gate ? "нужны" : null));
      row("Адрес", l.address); row("Сроки", l.deadline); row("Имя", l.name); row("Кампания", l.campaign); row("Заметки бота", l.notes);
      det.append(g);
      const note = el("textarea"); note.placeholder = "Заметка менеджера"; note.value = l.manager_note || "";
      note.addEventListener("change", () => api(`/api/lead/${l.id}`, { method: "POST", body: JSON.stringify({ note: note.value }) }));
      det.append(note);
      conv.append(det);
    }
    // сообщения
    const box = el("div", "msgs");
    let day = "";
    for (const m of messages) {
      const d = dayOf(m.at); if (d !== day) { box.append(el("div", "day", d)); day = d; }
      box.append(bubble(m));
    }
    conv.append(box);
    conv.append(composer());
    renderHeadState();
    box.scrollTop = box.scrollHeight;
  }

  function renderHeadState() {
    const c = st.chat?.contact; if (!c) return;
    const b = $("#botbtn"); if (b) b.textContent = c.bot_off ? "🤖 Вернуть бота" : "🤖 Бот отвечает — выключить";
    const ho = $("#handoff");
    if (ho) {
      ho.hidden = !c.needs_manager;
      ho.textContent = c.needs_manager ? "Нужен менеджер" + (c.handoff_reason ? ": " + c.handoff_reason : "") : "";
    }
    const note = $("#winnote"), comp = $("#comprow");
    if (note && comp) {
      const blocked = !st.connected ? "WhatsApp не подключён — откройте «Настройки»."
        : !c.window_open ? "Прошло больше 24 часов с последнего сообщения клиента. WhatsApp разрешает писать первым только по одобренному шаблону — попросите клиента написать или позвоните ему." : "";
      note.hidden = !blocked; note.textContent = blocked;
      comp.querySelectorAll("textarea, button").forEach((x) => (x.disabled = !!blocked));
    }
  }

  function composer() {
    const box = el("div", "comp"); box.style.position = "relative";
    const note = el("div", "note"); note.id = "winnote"; note.hidden = true;
    const wrap = el("div"); wrap.id = "comprow";
    const tools = el("div", "tools");
    const ta = el("textarea"); ta.placeholder = "Сообщение"; ta.rows = 1;
    const send = el("button", "btn ok", "➤"); send.title = "Отправить";
    const quick = el("button", null, "⚡ Ответы");
    const model = el("button", null, "🔗 Модель");
    const cat = el("button", null, "📘 Каталог PDF");
    const att = el("button", null, "📎 Файл");
    const file = el("input"); file.type = "file"; file.accept = "image/jpeg,image/png,.pdf,.doc,.docx,.xls,.xlsx"; file.hidden = true;
    tools.append(quick, model, cat, att, file);
    const row = el("div", "row"); row.append(ta, send);
    wrap.append(tools, row);
    box.append(note, wrap);

    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(160, ta.scrollHeight) + "px"; };
    ta.addEventListener("input", grow);
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer: fine)").matches) { e.preventDefault(); doSend(); } });
    send.addEventListener("click", doSend);
    async function post(body) {
      try { const m = await api(`/api/chat/${st.cur}/send`, { method: "POST", body: JSON.stringify(body) }); afterSend(m); return true; }
      catch (e) { alert(e.message); if (e.data?.id) afterSend(e.data); return false; }
    }
    async function doSend() {
      const text = ta.value.trim(); if (!text) return;
      send.disabled = true;
      if (await post({ text })) { ta.value = ""; grow(); }
      send.disabled = false; ta.focus();
    }
    cat.addEventListener("click", () => { if (confirm("Отправить клиенту каталог PDF?")) post({ catalog: true }); });
    model.addEventListener("click", () => {
      const n = (prompt("Номер модели из каталога (например, 8046):") || "").trim();
      if (/^\d{4}$/.test(n)) { ta.value = (ta.value ? ta.value + "\n" : "") + `Модель ${n}: ${SITE}#m-${n}`; grow(); ta.focus(); }
    });
    quick.addEventListener("click", () => {
      if (box.querySelector(".menu")) { box.querySelector(".menu").remove(); return; }
      const menu = el("div", "menu");
      QUICK.forEach((q) => { const b = el("button", null, q); b.addEventListener("click", () => { ta.value = q; grow(); menu.remove(); ta.focus(); }); menu.append(b); });
      box.append(menu);
    });
    att.addEventListener("click", () => file.click());
    file.addEventListener("change", async () => {
      const f = file.files[0]; file.value = ""; if (!f) return;
      const caption = prompt("Подпись к файлу (можно пусто):", "") ?? null; if (caption === null) return;
      att.disabled = true; att.textContent = "Отправка…";
      try {
        const m = await api(`/api/chat/${st.cur}/media`, { method: "POST", body: f,
          headers: { "content-type": f.type || "application/octet-stream", "x-filename": encodeURIComponent(f.name), "x-caption": encodeURIComponent(caption) } });
        afterSend(m);
      } catch (e) { alert(e.message); }
      att.disabled = false; att.textContent = "📎 Файл";
    });
    return box;
  }
  function afterSend(m) {
    if (!m || !m.id) return;
    st.chat.messages.push(m); st.lastId = Math.max(st.lastId, m.id);
    st.chat.contact.bot_off = true; st.chat.contact.needs_manager = false;
    const box = $(".msgs"); if (box) { box.append(bubble(m)); box.scrollTop = box.scrollHeight; }
    renderHeadState(); pollChats();
  }

  // ---------- заявки
  async function loadLeads() {
    const f = st.leadFilter, p = new URLSearchParams();
    if (f.status) p.set("status", f.status); if (f.q) p.set("q", f.q);
    let d; try { d = await api("/api/leads?" + p); } catch (e) { return; }
    if (view !== "leads") return;
    app.textContent = "";
    const page = el("div", "page");
    const bar = el("div", "bar"); const q = el("input"); q.placeholder = "Поиск: код, модель, имя, район, телефон"; q.value = f.q;
    let t; q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { f.q = q.value.trim(); loadLeads(); }, 300); });
    const r = el("button", "btn", "Обновить"); r.onclick = loadLeads;
    bar.append(q, r); page.append(bar);
    const cnt = Object.fromEntries(d.byStatus.map((x) => [x.status, x.n]));
    const chips = el("div", "chips");
    [["", "Все"], ...Object.entries(ST)].forEach(([k, label]) => {
      const c = el("button", "chip" + (f.status === k ? " on" : ""), label);
      if (k) c.append(el("b", null, String(cnt[k] || 0)));
      c.onclick = () => { f.status = k; loadLeads(); };
      chips.append(c);
    });
    page.append(chips);
    const src = el("p", "muted", "Источники за 30 дней: " + (d.bySource.map((s) => `${s.source} ${s.n}`).join(" · ") || "пока нет заявок"));
    page.append(src);
    if (!d.leads.length) page.append(el("p", "muted", "Заявок нет"));
    for (const l of d.leads) page.append(leadCard(l));
    app.append(page);
  }
  function leadCard(l) {
    const c = el("article", "card " + l.status);
    const top = el("div", "top");
    top.append(el("span", "code", "№" + l.code), el("span", "muted", dayOf(l.created_at) + ", " + hm(l.created_at)),
      el("span", "tag", KIND[l.kind] || l.kind), el("span", "tag src", l.source || "direct"));
    if (l.wa_phone) top.append(el("span", "muted", l.wa_phone));
    c.append(top);
    const g = el("div", "grid");
    const row = (k, v) => { if (v == null || v === "" || v === false) return; const x = el("div"); x.append(el("span", null, k + ": "), String(v === true ? "да" : v)); g.append(x); };
    row("Модель", l.model); row("Раздел", l.category); row("Объект", l.object_type); row("Изделие", l.product);
    row("Длина, м", l.length_m); row("Высота, м", l.height_m); row("Ворота", l.gates || (l.gate ? "нужны" : null));
    row("Адрес", l.address); row("Сроки", l.deadline); row("Имя", l.name); row("Кампания", l.campaign);
    if (g.children.length) c.append(g);
    if (l.message) { const det = el("details"); det.append(el("summary", null, "Сообщение"), el("pre", null, l.message)); c.append(det); }
    if (l.kind !== "form" && !l.contact_id) c.append(el("div", "muted", "Клиент открыл WhatsApp с сайта, но пока не написал."));
    if (l.kind === "form" && !l.contact_id) c.append(el("div", "muted", "Заявка из формы — сообщение в WhatsApp от клиента ещё не пришло."));
    const act = el("div", "act");
    const sel = el("select");
    Object.entries(ST).forEach(([k, v]) => { const o = el("option", null, v); o.value = k; o.selected = k === l.status; sel.append(o); });
    const note = el("textarea"); note.placeholder = "Заметка менеджера"; note.value = l.manager_note || "";
    const ok = el("span", "saved");
    const save = (body) => api(`/api/lead/${l.id}`, { method: "POST", body: JSON.stringify(body) })
      .then(() => { ok.textContent = "сохранено"; setTimeout(() => (ok.textContent = ""), 1500); }).catch(() => (ok.textContent = "ошибка"));
    sel.onchange = () => { c.className = "card " + sel.value; save({ status: sel.value }); };
    note.onchange = () => save({ note: note.value });
    act.append(sel, note);
    if (l.contact_id) { const b = el("button", "btn", "Открыть чат"); b.onclick = () => { st.cur = l.contact_id; go("chats"); }; act.append(b); }
    act.append(ok);
    c.append(act);
    return c;
  }

  // ---------- настройки
  async function loadSettings() {
    let s; try { s = await api("/api/settings"); } catch (e) { return; }
    if (view !== "settings") return;
    app.textContent = "";
    const page = el("div", "page");
    const field = (name, label, hint, type = "text", has) => {
      const l = el("label", null, label);
      if (hint) l.append(el("small", null, hint));
      const i = el("input"); i.type = type; i.name = name; i.autocomplete = "off";
      if (type === "password") i.placeholder = has ? "сохранено — оставьте пустым, чтобы не менять" : "не задано";
      else i.value = s[name] || "";
      l.append(i); return l;
    };
    const copyRow = (label, value) => {
      const l = el("label", null, label); const r = el("div", "copy");
      const i = el("input"); i.readOnly = true; i.value = value;
      const b = el("button", "btn sec", "Копировать"); b.type = "button";
      b.onclick = () => { navigator.clipboard?.writeText(value); b.textContent = "Скопировано"; setTimeout(() => (b.textContent = "Копировать"), 1500); };
      r.append(i, b); l.append(r); return l;
    };

    const wa = el("form", "set");
    wa.append(el("h3", null, "WhatsApp (Cloud API)"));
    const status = el("div", "muted", s.has_wa_token && s.wa_phone_id ? "Ключи сохранены. Нажмите «Проверить подключение»." : "Не подключено — заполните поля по инструкции ниже.");
    wa.append(status,
      field("wa_phone_id", "Phone number ID", "Meta → WhatsApp → API Setup → идентификатор номера"),
      field("wa_token", "Постоянный токен (System user access token)", "Meta Business → Пользователи системы → Сгенерировать токен (whatsapp_business_messaging, whatsapp_business_management)", "password", s.has_wa_token),
      field("wa_app_secret", "App secret", "Meta → приложение → Настройки → Основное → Секрет приложения", "password", s.has_wa_app_secret),
      field("graph_version", "Версия Graph API", "можно оставить пустым (v23.0)"));
    wa.append(el("h3", null, "Вебхук — вставить в Meta → WhatsApp → Configuration"),
      copyRow("Callback URL", s.webhook_url), copyRow("Verify token", s.wa_verify_token),
      el("div", "muted", "После «Verify and save» подпишитесь на поле messages."));
    wa.querySelector("input[name=graph_version]").placeholder = "v23.0";
    const bot = el("form", "set");
    bot.append(el("h3", null, "Автоответчик (ИИ)"));
    const bl = el("label"); bl.style.display = "flex"; bl.style.gap = "8px"; bl.style.alignItems = "center";
    const cb = el("input"); cb.type = "checkbox"; cb.name = "bot_enabled"; cb.checked = s.bot_enabled === "1"; cb.style.width = "auto";
    bl.append(cb, "Бот отвечает новым клиентам (собирает данные, цены не называет, передаёт менеджеру)");
    bot.append(bl,
      el("div", "muted", "Достаточно одного ключа. Бот пробует поставщиков по очереди: если один недоступен или упёрся в лимит — берёт следующий."),
      field("groq_key", "Ключ Groq (бесплатно)", "console.groq.com → API Keys", "password", s.has_groq_key),
      field("zai_key", "Ключ Z.ai — GLM (бесплатно)", "z.ai → API Keys", "password", s.has_zai_key),
      field("deepseek_key", "Ключ DeepSeek (платно, необязательно)", "platform.deepseek.com → API keys", "password", s.has_deepseek_key),
      field("anthropic_key", "Ключ Anthropic — Claude (платно, необязательно)", "console.anthropic.com → API Keys", "password", s.has_anthropic_key),
      field("bot_providers", "Порядок поставщиков", "например: groq,zai — пусто = все, для которых есть ключ (groq → zai → deepseek → anthropic)"));
    const other = el("form", "set");
    other.append(el("h3", null, "Прочее"), field("catalog_url", "Ссылка на каталог PDF", "по умолчанию — PDF на сайте"));

    const actions = el("div", "set");
    const save = el("button", "btn", "Сохранить"), test = el("button", "btn sec", "Проверить подключение");
    const res = el("div", "muted");
    const r = el("div", "bar"); r.append(save, test); actions.append(r, res);
    save.onclick = async () => {
      const body = {};
      for (const f of [wa, bot, other]) for (const i of f.querySelectorAll("input[name]")) {
        if (i.type === "checkbox") body[i.name] = i.checked ? "1" : "0";
        else if (i.type === "password") { if (i.value.trim()) body[i.name] = i.value.trim(); }
        else body[i.name] = i.value.trim();
      }
      try { await api("/api/settings", { method: "POST", body: JSON.stringify(body) }); res.className = "ok"; res.textContent = "Сохранено"; loadSettings(); }
      catch (e) { res.className = "bad"; res.textContent = e.message; }
    };
    test.onclick = async () => {
      res.className = "muted"; res.textContent = "Проверяю…";
      try {
        const d = await api("/api/settings/test");
        if (d.ok) { res.className = "ok"; res.textContent = `Подключено: ${d.display_phone_number} · ${d.verified_name || ""} · качество ${d.quality_rating || "—"}`; }
        else { res.className = "bad"; res.textContent = "Ошибка Meta: " + d.error; }
      } catch (e) { res.className = "bad"; res.textContent = e.message; }
    };
    const help = el("details", "set");
    help.append(el("summary", null, "Инструкция: как подключить номер к WhatsApp Cloud API"));
    const ol = el("ol");
    [
      "business.facebook.com → создайте бизнес-портфолио «Адгезия» (если его нет).",
      "developers.facebook.com → Мои приложения → Создать → сценарий «Связаться с клиентами через WhatsApp» → привязать к бизнес-портфолио.",
      "На телефоне: сначала сохраните нужные переписки (Чат → Ещё → Экспорт чата), затем WhatsApp Business → Настройки → Аккаунт → Удалить аккаунт. Номер +7 702 458 42 04 освобождается для API; дальше вся переписка — в этой CRM.",
      "В приложении Meta: WhatsApp → API Setup → Add phone number → профиль «Адгезия», категория, номер +7 702 458 42 04 → код из SMS/звонка.",
      "Скопируйте Phone number ID сюда. App secret — в Настройках приложения → Основное.",
      "Business Settings → Пользователи системы → добавить (Admin) → назначить приложение и аккаунт WhatsApp → Сгенерировать токен без срока действия с правами whatsapp_business_messaging и whatsapp_business_management → вставить сюда.",
      "Сохранить → «Проверить подключение».",
      "WhatsApp → Configuration → Edit: Callback URL и Verify token из этой страницы → Verify and save → Webhook fields → messages → Subscribe.",
      "Имя профиля «Адгезия» Meta проверяет сама (обычно до пары дней). Если Meta попросит способ оплаты — добавьте его в WhatsApp Manager: платные только рассылки по шаблонам, ответы клиентам, которые написали сами, в течение 24 часов бесплатны.",
    ].forEach((t) => ol.append(el("li", null, t)));
    help.append(ol);
    page.append(wa, bot, other, actions, help);
    app.append(page);
  }

  if (key) api("/api/chats").then(start).catch(() => {});
})();
</script>
</body>
</html>
